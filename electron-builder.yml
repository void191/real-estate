appId: com.realestate.viewingcoordinator
productName: Real Estate Viewing Coordinator
copyright: Copyright © 2026 Estate Coordinator Team

directories:
  output: release
  buildResources: resources

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: resources/icon.ico

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Real Estate Viewing Coordinator
  uninstallDisplayName: Real Estate Viewing Coordinator
  differentialPackage: false

files:
  - "dist/**/*"
  - "dist-electron/**/*"
  - "resources/**/*"
  - "package.json"

asar: true
